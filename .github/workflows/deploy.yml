name: Deploy WV Vendor Map

on:
push:
branches:
- main
workflow_dispatch:

permissions:
contents: read
pages: write
id-token: write

concurrency:
group: pages
cancel-in-progress: true

jobs:
build:
runs-on: ubuntu-latest

steps:
- name: Get repository files
uses: actions/checkout@v4

- name: Install pnpm
uses: pnpm/action-setup@v4
with:
version: 10

- name: Set up Node
uses: actions/setup-node@v4
with:
node-version: 22
cache: pnpm

- name: Install dependencies
run: pnpm install --frozen-lockfile

- name: Build website
run: pnpm --filter @workspace/wv-vendor-map build
env:
PORT: 5173
BASE_PATH: /West-Virginia-Vendor-Map-App/

- name: Configure GitHub Pages
uses: actions/configure-pages@v5

- name: Upload website
uses: actions/upload-pages-artifact@v3
with:
path: artifacts/wv-vendor-map/dist/public

deploy:
environment:
name: github-pages
url: ${{ steps.deployment.outputs.page_url }}
runs-on: ubuntu-latest
needs: build

steps:
- name: Publish website
id: deployment
uses: actions/deploy-pages@v4
